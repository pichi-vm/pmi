[package]
name = "pmi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pichi-vm/pmi"
description = "Type definitions for the Portable Machine Image (PMI) spec."

[dependencies]
flagset = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ciborium = "0.2"

[lints.clippy]
self_named_module_files = "deny"
